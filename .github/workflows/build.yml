name: Construire l'appli Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk PermisB.apk
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete appli --yes --cleanup-tag || true
          gh release create appli PermisB.apk --title "Permis B – version ${{ github.run_number }}" --notes "Télécharge PermisB.apk sur ton téléphone Android pour installer ou mettre à jour l'appli."
